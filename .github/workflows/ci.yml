name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate lockfile evidence (temporary)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo generate-lockfile
          echo 'BEGIN_LOCK_BASE64'
          base64 -w 0 Cargo.lock
          echo
          echo 'END_LOCK_BASE64'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: CLI smoke test
        run: cargo run -- --help
