name: Resolve Rust lockfile
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - '.github/workflows/resolve-lockfile.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      - name: Resolve dependency lock and emit artifact
        run: |
          cargo generate-lockfile
          echo BIOSDEVKIT_LOCK_BEGIN
          cat Cargo.lock
          echo BIOSDEVKIT_LOCK_END
