name: Validate evidence-schema
on:
  pull_request:
    paths:
      - 'schemas/test-evidence-v1.schema.json'
      - 'examples/test-evidence.synthetic.json'
      - 'tests/evidence-schema.py'
      - '.github/workflows/evidence-schema.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/test-evidence-v1.schema.json'
      - 'examples/test-evidence.synthetic.json'
      - 'tests/evidence-schema.py'
      - '.github/workflows/evidence-schema.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install schema validation dependency
        run: python3 -m pip install --disable-pip-version-check --user 'jsonschema==4.25.1'
      - name: Validate synthetic fixtures and rejected schema version
        run: python3 tests/evidence-schema.py
