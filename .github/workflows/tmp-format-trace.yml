name: Capture formatted trace sources
on:
  pull_request:
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt
      - run: |
          cargo fmt --all
          echo FORMAT_TRACE_START
          cat src/traces.rs
          echo FORMAT_TRACE_END
          echo FORMAT_MAIN_START
          cat src/main.rs
          echo FORMAT_MAIN_END
