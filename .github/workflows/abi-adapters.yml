name: Validate synthetic ABI adapters
on:
  pull_request:
    paths:
      - 'schemas/abi-adapter-v1.schema.json'
      - 'examples/abi-adapter-pce.synthetic.json'
      - 'examples/abi-adapter-mcd.synthetic.json'
      - 'tests/abi-adapter-schema.py'
      - 'tools/abi_semantics.py'
      - 'docs/abi-adapters.md'
      - '.github/workflows/abi-adapters.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/abi-adapter-v1.schema.json'
      - 'examples/abi-adapter-pce.synthetic.json'
      - 'examples/abi-adapter-mcd.synthetic.json'
      - 'tests/abi-adapter-schema.py'
      - 'docs/abi-adapters.md'
      - '.github/workflows/abi-adapters.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned jsonschema
        run: python3 -m pip install --disable-pip-version-check --user 'jsonschema==4.25.1'
      - name: Validate synthetic schema and negative cases
        run: python3 tests/abi-adapter-schema.py
