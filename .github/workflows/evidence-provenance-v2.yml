name: Validate evidence provenance v2
on:
  pull_request:
    paths:
      - 'schemas/test-evidence-v2.schema.json'
      - 'examples/test-evidence-v2.synthetic.json'
      - 'tests/evidence-provenance-v2.py'
      - 'docs/evidence-provenance-v2.md'
      - '.github/workflows/evidence-provenance-v2.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/test-evidence-v2.schema.json'
      - 'examples/test-evidence-v2.synthetic.json'
      - 'tests/evidence-provenance-v2.py'
      - 'docs/evidence-provenance-v2.md'
      - '.github/workflows/evidence-provenance-v2.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned jsonschema
        run: python3 -m pip install --disable-pip-version-check --user 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Validate synthetic schema and negative cases
        run: python3 tests/evidence-provenance-v2.py
