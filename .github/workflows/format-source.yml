name: Format Rust source artifact
on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/format-source.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt
      - run: |
          cargo fmt --all
          echo BIOSDEVKIT_FORMAT_BEGIN
          cat src/*.rs
          echo BIOSDEVKIT_FORMAT_END
